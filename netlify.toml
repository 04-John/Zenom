[build]
  # Production deploys apply pending database migrations first (see
  # scripts/migrate-deploy.mjs); previews and local builds skip that step.
  command = "node scripts/migrate-deploy.mjs && npm run build"

[build.environment]
  NODE_VERSION = "20"
  # These values are public by design (site URL, public contact details, Sentry
  # browser DSN, Cloudinary cloud name in image URLs). Real secrets stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,WHATSAPP_BUSINESS_NUMBER,ADMIN_SEED_EMAIL,SENTRY_DSN,CLOUDINARY_CLOUD_NAME"
